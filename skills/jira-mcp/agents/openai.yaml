interface:
  display_name: "Jira MCP"
  short_description: "Query and update self-hosted Jira with your own account"
  default_prompt: "Use $jira-mcp to show my recently updated assigned Jira issues."
dependencies:
  tools:
    - type: "mcp"
      value: "jira"
      description: "Bundled Jira Server MCP configured with the current user's identity"
      transport: "stdio"
